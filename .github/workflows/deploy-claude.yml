name: Deploy Claude Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/claude-diagnose/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-claude.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy claude-diagnose to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy claude-diagnose --project-ref qwhzwzaaisqmlsttkgsp --yes