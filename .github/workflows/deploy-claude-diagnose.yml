name: Deploy claude-diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/claude-diagnose/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy claude-diagnose
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing GitHub secret SUPABASE_PROJECT_ID" && exit 1)
          supabase functions deploy claude-diagnose --project-ref "$SUPABASE_PROJECT_ID"
